# Builds, tests and packs on x64 and ARM64, and publishes the AOT smoke test with native AOT on both.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm and macos-latest run on ARM64; the others on x64
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # the solution builds with no warnings, and must stay that way
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test Test -c Release --no-build
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/

  aot:
    name: Native AOT (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # the project treats warnings as errors, so a trimming or AOT warning in the libraries fails the publish
      - run: dotnet publish AotSmokeTest -c Release -r ${{ matrix.rid }} -o aot
      - run: ./aot/AotSmokeTest
